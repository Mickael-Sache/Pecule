<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" routerLink="/">Pécule</a>
    <nav class="main-nav" aria-label="Navigation principale">
      <ul>
        <li><a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Accueil</a></li>
        @if(auth.isAuthenticated())
        {
          <li><a routerLink="/accounts" routerLinkActive="active" ariaCurrentWhenActive="page">Mes comptes</a></li>
        }
      </ul>
    </nav>
    <div class="user-menu">
      @if(auth.user(); as user)
      {
        <span class="muted small">{{user.email}}</span>
        <button class="btn btn-quiet" type="button" (click)="logout();">Se déconnecter</button>
      } @else {
        <a class="btn btn-quiet" routerLink="/login">Se connecter</a>
        <a class="btn" routerLink="/register">Créer un compte</a>
      }
    </div>
  </div>
</header>
<main id="contenu" class="page" tabindex="-1">
  <router-outlet />
</main>
<footer>
  <p>Accessibilité : non conforme (audit à venir)</p>
</footer>

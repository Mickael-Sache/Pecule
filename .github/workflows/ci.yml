name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build
     
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pecule:ci .
      
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: dotnet build src/Pecule.Host -c Release
      - run: npm ci
        working-directory: front
      - run: npm run generate:api
        working-directory: front
      - name: Le contrat d'API committé est à jour
        run: git diff --exit-code -- front/openapi front/src/app/api
        
  e2e:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Attendre que l'API soit prête
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npx playwright install --with-deps chromium
        working-directory: front
      - run: npx playwright test --project=chromium
        working-directory: front
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report
      - name: Journaux de l'application
        if: failure()
        run: docker compose logs app
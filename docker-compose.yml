services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pecule
      POSTGRES_USER: pecule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pecule -d pecule"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      ConnectionStrings__Pecule: "Host=db;Database=pecule;Username=pecule;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: